name: Deploy Project

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v7.0.1

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci
        working-directory: ./second-step

      - name: Run Test
        run: npm test
        working-directory: ./second-step

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v7.0.1

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci
        working-directory: ./second-step

      - name: Run Test
        run: npm test
        working-directory: ./second-step
      - name: Build Project
        run: npm run build
        working-directory: ./second-step
      - name: Deploy
        run: echo "Dplyinf"


